test_connection:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: dreame_fp10

read_properties:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: dreame_fp10
    properties:
      required: false
      example: '["3.3", "3.2"]'
      selector:
        object:

start_auto_clean:
  name: Start filter self-cleaning
  description: Request U2513 filter self-cleaning. Physical completion is reported by the status sensor.
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: dreame_fp10

manage_schedule:
  name: Manage power schedule
  description: Read-modify-write one U2513 fixed-time power schedule. The service does not execute or test a schedule on the device.
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: dreame_fp10
    operation:
      required: true
      selector:
        select:
          options:
            - create
            - update
            - delete
            - enable
    slot:
      required: true
      description: One-based slot 1-5. Create must use the next slot; delete compacts later slots.
      selector:
        number:
          min: 1
          max: 5
          mode: box
    name:
      required: false
      selector:
        text:
    time:
      required: false
      example: "22:30"
      selector:
        text:
    end_time:
      required: false
      description: Optional power-off time. Only valid with an on schedule.
      example: "06:30"
      selector:
        text:
    repeat_mask:
      required: false
      description: Eight 0/1 digits. Common masks are once 10000000, daily 01111111, weekdays 01111100, weekend 00000011.
      example: "01111100"
      selector:
        text:
    action:
      required: false
      selector:
        select:
          options:
            - on
            - off
    enabled:
      required: false
      selector:
        boolean:
